{# Poner el precio a un LOTE sin precio (Almacén, Logística, Gerencia) o corregir el de un lote (solo Gerencia, con motivo).
   Todo lo que ya salió de ese lote se recalcula con el precio nuevo. Queda en el Kardex (PRECIO COMPLETADO / AJUSTE DE COSTO). #}
<form method="POST" id="formPrecioLote" class="d-none">
    <input type="hidden" name="precio_unitario" id="pl_unit"><input type="hidden" name="precio_total" id="pl_total">
    <input type="hidden" name="motivo" id="pl_motivo"><input type="hidden" name="moneda" id="pl_moneda">
    <input type="hidden" name="volver" value="{{ request.full_path }}">
</form>
<script>
function precioLote(loteId, nombre, actual, moneda, cantidad, salieron, eligeMoneda) {
    const e = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const correccion = actual !== null && actual !== undefined;
    let mon = moneda === 'USD' ? 'USD' : 'PEN';
    const sim = () => mon === 'USD' ? 'US$' : 'S/';
    Swal.fire({
        title: correccion ? 'Corregir el precio del lote' : 'Poner precio al lote', width: 500, focusConfirm: false,
        html: `<div class="text-start small">
                 <div class="text-muted mb-2">${e(nombre)} · Lote #${loteId} · ${cantidad} und${salieron ? ` (ya salieron ${salieron})` : ''}</div>
                 ${correccion ? `<div class="d-flex justify-content-between border rounded p-2 mb-2 bg-light"><span>Precio actual</span><b>${sim()} ${Number(actual).toFixed(4)}</b></div>` : ''}
                 ${eligeMoneda ? `<div class="btn-group w-100 mb-2"><input type="radio" class="btn-check" name="pl_m" id="pl_pen" value="PEN" ${mon === 'PEN' ? 'checked' : ''}><label class="btn btn-outline-primary btn-sm" for="pl_pen">S/ Soles</label>
                    <input type="radio" class="btn-check" name="pl_m" id="pl_usd" value="USD" ${mon === 'USD' ? 'checked' : ''}><label class="btn btn-outline-success btn-sm" for="pl_usd">US$ Dólares</label></div>` : ''}
                 <div class="row g-2"><div class="col-6"><label class="fw-bold">Precio unit. con IGV</label><input id="pl_u" type="number" min="0" step="any" class="form-control"></div>
                     <div class="col-6"><label class="fw-bold">o total del lote</label><input id="pl_t" type="number" min="0" step="any" class="form-control"></div></div>
                 ${correccion ? `<label class="fw-bold mt-2">Motivo de la corrección *</label><textarea id="pl_mot" class="form-control" rows="2" maxlength="200" placeholder="Ej: la factura se registró sin IGV"></textarea>` : ''}
                 <div class="mt-2 p-2 rounded" style="background:#eff6ff; border:1px solid #bfdbfe; font-size:.75rem;"><i class="bi bi-info-circle"></i>
                    ${salieron ? 'Las salidas que ya sacaron de este lote se <b>recalculan</b> con este precio (el gasto por área queda real). ' : ''}Queda en el Kardex con tu nombre, fecha y hora.</div></div>`,
        showCancelButton: true, confirmButtonText: 'Guardar precio', cancelButtonText: 'Cancelar',
        didOpen: () => {
            const u = document.getElementById('pl_u'), t = document.getElementById('pl_t');
            u.addEventListener('input', () => { const v = parseFloat(u.value); t.value = v > 0 ? (v * cantidad).toFixed(2) : ''; });
            t.addEventListener('input', () => { const v = parseFloat(t.value); u.value = v > 0 ? (v / cantidad).toFixed(4) : ''; });
            document.querySelectorAll('input[name=pl_m]').forEach(r => r.addEventListener('change', () => mon = r.value));
            u.focus();
        },
        preConfirm: () => {
            const u = parseFloat(document.getElementById('pl_u').value), t = parseFloat(document.getElementById('pl_t').value);
            const motivo = correccion ? document.getElementById('pl_mot').value.trim() : '';
            if (!(u > 0) && !(t > 0)) return Swal.showValidationMessage('Escribe el precio unitario o el total.');
            if (correccion && motivo.length < 5) return Swal.showValidationMessage('Escribe el motivo (queda en la auditoría).');
            return { u: u > 0 ? u : '', t: t > 0 ? t : '', motivo };
        }
    }).then(r => {
        if (!r.isConfirmed) return;
        const f = document.getElementById('formPrecioLote');
        f.action = `/insumos/lote/${loteId}/precio`;
        document.getElementById('pl_unit').value = r.value.u; document.getElementById('pl_total').value = r.value.t;
        document.getElementById('pl_motivo').value = r.value.motivo; document.getElementById('pl_moneda').value = eligeMoneda ? mon : '';
        f.submit();
    });
}
</script>
