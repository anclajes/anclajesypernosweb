<html>
<head>
<meta charset="utf-8">
<style>
    @page {
        size: letter;
        margin: 1cm;
    }
    body {
        font-family: Helvetica, Arial, sans-serif;
        font-size: 9pt;
        color: #1a1a1a;
    }
    table.hoja {
        width: 100%;
        border-collapse: collapse;
    }
    /* Sin líneas divisorias: el espacio en blanco entre etiquetas ya las separa bien, y así
       se evita también el problema de la línea pisando las letras en xhtml2pdf. */
    table.hoja td.celda {
        width: 50%;
        padding: 9px;
        vertical-align: top;
    }
    div.etiqueta {
        padding: 4px;
        page-break-inside: avoid;
    }
    table.interna {
        width: 100%;
        table-layout: fixed;
    }
    table.interna td.qr {
        width: 165px;
        text-align: center;
        vertical-align: middle;
    }
    table.interna td.qr img {
        width: 150px;
        height: 150px;
    }
    table.interna td.datos {
        vertical-align: middle;
        padding-left: 12px;
    }
    .sku {
        font-size: 18pt;
        font-weight: bold;
        color: #0F172A;
    }
    .nombre {
        font-size: 13pt;
        color: #333333;
        margin-top: 2px;
        line-height: 1.1;
    }
    .calidad {
        font-size: 11pt;
        color: #555555;
        margin-top: 3px;
    }
</style>
</head>
<body>
    <table class="hoja">
        {% for fila in etiquetas|batch(2) %}
        <tr>
            {% for e in fila %}
            <td class="celda">
                <div class="etiqueta">
                    <table class="interna">
                        <tr>
                            <td class="qr"><img src="{{ e.qr_data_uri }}" /></td>
                            <td class="datos">
                                <div class="sku">{{ e.sku }}</div>
                                <div class="nombre">{{ e.nombre[:100] }}{% if e.nombre|length > 100 %}...{% endif %}</div>
                                {% if e.calidad %}<div class="calidad">{{ e.calidad }}</div>{% endif %}
                            </td>
                        </tr>
                    </table>
                </div>
            </td>
            {% endfor %}
            {% for _ in range(2 - fila|length) %}
            <td class="celda"></td>
            {% endfor %}
        </tr>
        {% endfor %}
    </table>
</body>
</html>
